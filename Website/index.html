<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>冰面编辑器</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      font-size: 12px;
      --bg: #1e1e1e;
      --panel: #252526;
      --raised: #2d2d30;
      --border: #454545;
      --text: #d4d4d4;
      --muted: #9da0a4;
      --accent: #007acc;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
    button, input, select { font: inherit; }
    button, select, input[type="number"] {
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 0;
      background: var(--raised);
      color: var(--text);
    }
    button { padding: 0 10px; cursor: pointer; white-space: nowrap; }
    button:hover, select:hover { background: #383838; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 1px solid #75beff; outline-offset: 1px; }
    button.active, button[aria-pressed="true"] { background: #094771; border-color: #007acc; color: #fff; }
    button:disabled { opacity: .45; cursor: default; }
    select { min-width: 82px; padding: 0 6px; cursor: pointer; }
    input[type="number"] { width: 58px; padding: 0 6px; }
    #width { width: 86px; }
    #field { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    #field[data-tool="select"] { cursor: default; }
    #field[data-tool="spawn"] { cursor: crosshair; }
    #field[data-tool="route"] { cursor: crosshair; }
    #field.panning { cursor: grabbing; }
    body.drive #field { cursor: default; }
    body.drive .editor-only { display: none; }
    body:not(.drive) .drive-only { display: none; }
    .toolbar {
      position: fixed; z-index: 2; top: 12px; left: 12px; right: 12px;
      display: flex; flex-wrap: wrap; align-items: flex-start; gap: 7px;
      pointer-events: none;
    }
    .group {
      display: flex; align-items: center; gap: 4px; min-height: 38px;
      padding: 4px; border: 1px solid #3f3f46; background: var(--panel);
      box-shadow: 0 2px 8px #0005; pointer-events: auto;
    }
    .group button { min-width: 30px; }
    .group .number-field { display: flex; align-items: center; gap: 5px; padding: 0 5px; color: var(--muted); white-space: nowrap; }
    .spacer { flex: 1; min-width: 0; }
    .key { width: 26px; padding: 0; }
    #drive-keys {
      position: fixed; z-index: 2; right: 12px; bottom: 12px;
      display: none; grid-template-columns: repeat(3, 32px); gap: 4px;
      padding: 7px; border: 1px solid #3f3f46; background: var(--panel);
      box-shadow: 0 2px 8px #0005; pointer-events: none;
    }
    body.drive #drive-keys { display: grid; }
    #drive-keys .key { width: 32px; height: 30px; text-align: center; line-height: 28px; border: 1px solid var(--border); background: var(--raised); color: var(--muted); }
    #drive-keys .key.down { background: #094771; border-color: #007acc; color: #fff; }
    #drive-keys .w { grid-column: 2; }
    #drive-keys .a { grid-column: 1; grid-row: 2; }
    #drive-keys .s { grid-column: 2; grid-row: 2; }
    #drive-keys .d { grid-column: 3; grid-row: 2; }
    #stage { display: none; min-width: 40px; text-align: center; color: #9cdcfe; font-variant-numeric: tabular-nums; }
    #stage.visible { display: inline-block; }
    .status {
      position: fixed; z-index: 2; left: 12px; right: 12px; bottom: 12px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0;
      min-height: 37px; width: max-content; max-width: calc(100% - 24px);
      border: 1px solid #3f3f46; background: var(--panel);
      box-shadow: 0 2px 8px #0005; pointer-events: none;
    }
    .metric { display: flex; align-items: baseline; gap: 7px; padding: 9px 12px; border-right: 1px solid #3b3b3b; white-space: nowrap; }
    .metric:last-child { border-right: 0; }
    .metric span { color: var(--muted); }
    .metric strong { font-weight: 600; font-variant-numeric: tabular-nums; color: #dcdcdc; }
    #sequence-panel {
      position: fixed; z-index: 3; top: 62px; right: 12px; width: 430px;
      max-width: calc(100vw - 24px); height: min(740px, calc(100vh - 130px)); min-height: 260px;
      display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid #4a4a4a; background: var(--panel); box-shadow: 0 6px 18px #0008;
    }
    #sequence-panel[hidden] { display: none; }
    .panel-head { flex: none; display: flex; align-items: center; gap: 5px; padding: 6px; border-bottom: 1px solid var(--border); background: var(--panel); }
    .panel-head b { flex: 1; padding-left: 5px; font-weight: 600; }
    .sequence-edit { flex: none; display: grid; gap: 6px; padding: 8px; border-bottom: 1px solid var(--border); }
    .sequence-edit-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
    #sequence-selected { min-width: 72px; color: #9cdcfe; font-variant-numeric: tabular-nums; }
    .sequence-duration-label { display: flex; align-items: center; gap: 5px; color: var(--muted); white-space: nowrap; }
    #sequence-duration { width: 82px; font-variant-numeric: tabular-nums; }
    #sequence-remove { margin-left: auto; }
    .sequence-edit-keys { display: flex; gap: 4px; }
    .sequence-edit-keys .key { width: 42px; }
    .sequence-lane-head { flex: none; display: grid; grid-template-columns: 52px repeat(4, 1fr); height: 28px; border-bottom: 1px solid var(--border); background: #202022; }
    .sequence-lane-head span { display: grid; place-items: center; border-right: 1px solid #383838; color: var(--muted); font-weight: 600; }
    .sequence-lane-head span:last-child { border-right: 0; }
    #sequence-timeline { position: relative; flex: 1; min-height: 0; overflow: hidden; cursor: grab; touch-action: none; background: #1e1e1e; }
    #sequence-timeline.dragging { cursor: grabbing; }
    #sequence-canvas { display: block; width: 100%; height: 100%; }
    #sequence-playhead { position: absolute; z-index: 1; top: 50%; left: 0; right: 0; height: 0; border-top: 1px solid #e06c75; pointer-events: none; }
    #sequence-time-value { position: absolute; top: 0; left: 0; width: 52px; height: 22px; transform: translateY(-50%); display: grid; place-items: center; color: #f0a0a6; background: #252526; border-right: 1px solid #e06c75; font-variant-numeric: tabular-nums; }
    #toast { position: fixed; z-index: 4; right: 12px; bottom: 58px; padding: 8px 12px; border: 1px solid #555; background: var(--panel); box-shadow: 0 2px 8px #0008; }
    #toast[hidden] { display: none; }
    #information-panel {
      position: fixed; z-index: 3; width: 218px; max-width: calc(100vw - 24px);
      max-height: calc(100vh - 150px); overflow-y: auto;
      padding: 5px; border: 1px solid var(--border); background: var(--panel);
      box-shadow: 0 4px 12px #0006;
    }
    #information-panel[hidden] { display: none; }
    body.ui-hidden > :not(#field):not(.toolbar):not(script) { display: none !important; }
    body.ui-hidden .toolbar > :not(.play-group),
    body.ui-hidden .play-group > :not(#play) { display: none !important; }
    body.ui-hidden .play-group { padding: 0; border: 0; background: none; box-shadow: none; min-height: 0; }
    .information-option { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 3px 6px; cursor: pointer; }
    .information-option:hover { background: var(--raised); }
    .information-option input { margin: 0; accent-color: var(--accent); cursor: pointer; }
    .information-swatch { width: 17px; height: 3px; background: var(--ink); flex: none; }
    .information-option:nth-child(5) { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 7px; }
    .information-option:nth-child(9) { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 7px; }
    @media (max-width: 850px) {
      .spacer { display: none; }
      .toolbar { right: 8px; left: 8px; top: 8px; gap: 4px; }
      .group { min-height: 36px; }
      .group button { padding: 0 7px; }
      #sequence-panel { top: 112px; right: 8px; height: min(740px, calc(100vh - 180px)); }
      .status { left: 8px; bottom: 8px; max-width: calc(100% - 16px); }
      .metric { padding: 7px 8px; }
      #drive-keys { right: 8px; bottom: 72px; }
    }
  </style>
</head>
<body>
  <canvas id="field" tabindex="-1" aria-label="冰面地图"></canvas>
  <div class="toolbar">
    <div class="group"><button id="mode-toggle" title="从当前船状态开始操纵并录制；原序列可撤销恢复">操纵</button><button id="record-toggle" class="drive-only" title="开始新录制或停止录制，R">录制中</button></div>
    <div class="group editor-only" role="toolbar" aria-label="编辑工具">
      <button data-tool="paint" title="绘制冰面" aria-pressed="true">绘制</button>
      <button data-tool="erase" title="擦除为普通地面" aria-pressed="false">擦除</button>
      <button data-tool="bezier" title="钢笔：单击锚点，拖动设置切线；双击结束当前冰面" aria-pressed="false">贝塞尔</button>
      <button data-tool="route" title="钢笔：单击锚点，拖动设置切线；自动连接后续路线" aria-pressed="false">路线</button>
      <button data-tool="select" title="选择并拖动曲线或控制点" aria-pressed="false">选择</button>
      <button data-tool="spawn" title="拖拽设置船位和朝向" aria-pressed="false">船位</button>
      <span id="stage"></span>
    </div>
    <div class="group editor-only">
      <select id="material" aria-label="冰面材质">
        <option value="blue">蓝冰</option>
        <option value="packed">浮冰</option>
        <option value="ice">普通冰</option>
      </select>
      <label class="number-field">宽 <input id="width" type="number" min="1" step="1" value="3" aria-label="铺设宽度，方块"></label>
      <button id="undo" title="撤销 Ctrl+Z">撤销</button>
      <button id="redo" title="重做 Ctrl+Y">重做</button>
      <button id="clear" title="清空冰面和曲线">清空</button>
    </div>
    <div class="group play-group">
      <button id="play" title="运行或暂停，空格；F1 隐藏 / 显示界面">运行</button>
      <button id="step" title="前进 0.2 tick（0.01 秒）">+0.2t</button>
      <button id="reset" title="船回到起点">复位</button>
      <select id="rate" aria-label="播放速度">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
      </select>
      <button id="sequence-toggle" class="editor-only" title="编辑按键输入序列" aria-expanded="false">序列</button>
      <button id="follow" class="editor-only" title="运行时镜头跟随船" aria-pressed="false">跟随</button>
      <button id="center" title="镜头移到船位">居中</button>
    </div>
    <div class="group editor-only">
      <button id="route-calculate" title="边开船边按船速向前生成居中路径">自动+路径</button>
      <button id="auto-run" title="从路线起点运行逆动力学控制，并记录按键序列">自动</button>
      <button id="route-clear" title="清空手绘路线">删路线</button>
    </div>
    <div class="group">
      <button id="information-toggle" aria-pressed="false" aria-expanded="false" aria-controls="information-panel" title="总控 B 点的图形信息；每项可独立开启">显示更多信息</button>
    </div>
    <div class="spacer"></div>
    <div class="group editor-only">
      <button id="export" title="导出地图、曲线、船状态和输入序列">导出 JSON</button>
      <button id="import" title="导入 JSON">导入 JSON</button>
      <input id="file" type="file" accept="application/json,.json" hidden>
    </div>
  </div>
  <aside id="information-panel" aria-label="图形信息开关" hidden>
    <label class="information-option" title="在 B 点平移显示 P 点切线；黄色切线与红色移动方向之间的扇形表示夹角。静止时不显示移动方向。"><input type="checkbox" data-information="direction" checked><span class="information-swatch" style="--ink:#dcdcaa" aria-hidden="true"></span>移动方向 / P 切线</label>
    <label class="information-option" title="青色船头与红色移动方向之间的内层扇形表示侧滑角。"><input type="checkbox" data-information="slip"><span class="information-swatch" style="--ink:#58c4dd" aria-hidden="true"></span>船头 / 移动方向</label>
    <label class="information-option" title="按 P 点切线分解当前世界速度；黄色为切向分量，紫色为法向分量，虚线构成向量平行四边形。"><input type="checkbox" data-information="velocity"><span class="information-swatch" style="--ink:#c8a0d0" aria-hidden="true"></span>速度分解</label>
    <label class="information-option" title="船底接触范围与冰面边缘；橙色法向箭头表示以 0.04 侧向推力消除横向速度所需的距离。"><input type="checkbox" data-information="clearance"><span class="information-swatch" style="--ink:#ce9178" aria-hidden="true"></span>船体 / 侧向停止距离</label>
    <label class="information-option" title="自动模式：紫色是求解推力，青色是下一 tick 实际按键推力，虚线分解切向和法向；圆表示 W 的 0.04 推力幅值。"><input type="checkbox" data-information="thrust" checked><span class="information-swatch" style="--ink:#c586c0" aria-hidden="true"></span>目标 / 实际推力</label>
    <label class="information-option" title="自动模式：每根细箭头是转向预测中一 tick 的 W 推力。阶梯图绿色为累计可用侧向推力，橙色为累计需求；底部填充比例为最终 W 占空比，细竖线为累计求解占空比。"><input type="checkbox" data-information="cumulative" checked><span class="information-swatch" style="--ink:#b5cea8" aria-hidden="true"></span>累计 W 求解过程</label>
    <label class="information-option" title="自动模式：散点是实际搜索过的纵向推力及代价，颜色由暗到亮表示搜索先后；底部两排区间显示两支黄金分割搜索的收敛，紫色菱形是最优 W 候选。"><input type="checkbox" data-information="search"><span class="information-swatch" style="--ink:#d7ba7d" aria-hidden="true"></span>候选解 / 搜索收敛</label>
    <label class="information-option" title="自动模式：青色弧线和端点表示求解器转向预测中的逐 tick 船头，灰色虚线表示完全释放按键后的角速度衰减。"><input type="checkbox" data-information="rotation"><span class="information-swatch" style="--ink:#9cdcfe" aria-hidden="true"></span>转向 / 旋转惯性</label>
    <label class="information-option" title="粉色垂线连接 B 与路线最近投影点，直角标记表示法向偏差，短虚线是该处路线切线。"><input type="checkbox" data-information="projection"><span class="information-swatch" style="--ink:#e695b8" aria-hidden="true"></span>路线投影 / 横向偏差</label>
    <label class="information-option" title="黄色虚线将路线局部曲率平移到 B 点；法向箭头表示 v沿线² × 曲率的侧向推力需求，绿色表示不超过 W 的 0.04 能力，红色表示超过。两侧短刻线表示 0.04。"><input type="checkbox" data-information="curvature"><span class="information-swatch" style="--ink:#e5c07b" aria-hidden="true"></span>路线曲率 / 转弯需求</label>
    <label class="information-option" title="沿 B-P 弦线显示 16 处船体冰面采样：绿色为船底全部接触冰，红色为触及普通地面；四个方框表示实际船体覆盖范围。离散采样用于观察局部接触情况。"><input type="checkbox" data-information="chord"><span class="information-swatch" style="--ink:#98c379" aria-hidden="true"></span>B-P 弦线 / 冰面采样</label>
    <label class="information-option" title="高亮船底实际接触的方块：蓝色为蓝冰，绿色为浮冰，浅蓝为普通冰，红色为普通地面。内环按接触方块数显示材质比例，外环填充表示当前速度和角速保留系数。"><input type="checkbox" data-information="contacts"><span class="information-swatch" style="--ink:#4ec9b0" aria-hidden="true"></span>接触方块 / 摩擦</label>
    <label class="information-option" title="从 B 点绘制一 tick 速度合成：红色是当前速度，灰色是阻尼后速度，青色是下一 tick 速度；橙色连接表示阻尼损失，绿色连接表示实际按键推力。所有向量使用同一比例。"><input type="checkbox" data-information="acceleration"><span class="information-swatch" style="--ink:#d19a66" aria-hidden="true"></span>阻尼 / 速度更新</label>
    <label class="information-option" title="从当前真实 tick 状态释放全部按键，按实际地面摩擦预测未来 24 tick。轨迹点间距显示减速，终点箭头显示仍在衰减的船头旋转；绿色为全船体在冰上，红色为接触普通地面。"><input type="checkbox" data-information="coast"><span class="information-swatch" style="--ink:#7ec8c8" aria-hidden="true"></span>释放按键 / 滑行预测</label>
  </aside>
  <aside id="sequence-panel" hidden>
    <div class="panel-head">
      <b>输入序列 · 0.2 tick</b>
      <button id="sequence-add" title="添加一段">添加</button>
      <button id="sequence-run" title="从序列起点运行">执行</button>
      <button id="sequence-close" aria-label="关闭输入序列">关闭</button>
    </div>
    <div class="sequence-edit">
      <div class="sequence-edit-line">
        <span id="sequence-selected"></span>
        <label class="sequence-duration-label">持续 <input id="sequence-duration" type="number" min="0.2" max="100000" step="0.2" aria-label="选中段持续 tick 数"> tick</label>
        <button id="sequence-remove" title="删除选中段">删除</button>
      </div>
      <div class="sequence-edit-keys" aria-label="选中段按键状态">
        <button class="key" data-sequence-key="w" aria-pressed="false">W</button>
        <button class="key" data-sequence-key="a" aria-pressed="false">A</button>
        <button class="key" data-sequence-key="s" aria-pressed="false">S</button>
        <button class="key" data-sequence-key="d" aria-pressed="false">D</button>
      </div>
    </div>
    <div class="sequence-lane-head" aria-hidden="true"><span>tick</span><span>W</span><span>A</span><span>S</span><span>D</span></div>
    <div id="sequence-timeline" title="拖拽移动时间线，滚轮缩放；点击选择段">
      <canvas id="sequence-canvas" aria-label="W A S D 按键时间线"></canvas>
      <div id="sequence-playhead"><span id="sequence-time-value">0.0</span></div>
    </div>
  </aside>
  <div class="status" aria-live="off">
    <div class="metric"><span>Tick</span><strong id="m-tick">0</strong></div>
    <div class="metric"><span>X / Z</span><strong id="m-pos">0.00 / 0.00</strong></div>
    <div class="metric"><span>速度</span><strong id="m-speed">0.000</strong></div>
    <div class="metric"><span>偏航</span><strong id="m-slip">0.0°</strong></div>
    <div class="metric"><span>船头</span><strong id="m-yaw">0.0°</strong></div>
    <div class="metric"><span>角速</span><strong id="m-omega">0.00°/t</strong></div>
    <div class="metric"><span>摩擦</span><strong id="m-friction">0.989</strong></div>
    <div class="metric"><span>输入</span><strong id="m-input">—</strong></div>
    <div class="metric"><span>p 进度</span><strong id="m-route-progress">—</strong></div>
    <div class="metric"><span>b-p</span><strong id="m-route-error">—</strong></div>
    <div class="metric"><span>W 占空</span><strong id="m-route-demand">—</strong></div>
    <div class="metric"><span>目标角</span><strong id="m-route-heading">—</strong></div>
  </div>
  <div id="drive-keys" aria-hidden="true"><span class="key w">W</span><span class="key a">A</span><span class="key s">S</span><span class="key d">D</span></div>
  <div id="toast" hidden></div>

  <script id="physics">
    (() => {
      'use strict';
      const F32 = Math.fround;
      const FRICTION = Object.freeze({ ground: F32(0.6), ice: F32(0.98), packed: F32(0.98), blue: F32(0.989) });
      const SIN_SCALE = 10430.378350470453;
      const DEG_TO_RAD_F = F32(Math.PI / 180);
      const HALF_WIDTH = 1.375 / 2;
      const SIN = new Float32Array(65536);
      for (let i = 0; i < SIN.length; i++) SIN[i] = F32(Math.sin(i / SIN_SCALE));
      function mcSin(angle) { return SIN[Math.trunc(angle * SIN_SCALE) & 65535]; }
      function mcCos(angle) { return SIN[Math.trunc(angle * SIN_SCALE + 16384) & 65535]; }

      // Flat, full-cube blocks at one height: intersect the 1.375-block-wide hull-bottom slice.
      // Minecraft counts touched block shapes once each; it does not weight by overlap area.
      function frictionAt(x, z, terrainAt) {
        const x0 = Math.floor(x - HALF_WIDTH);
        const x1 = Math.ceil(x + HALF_WIDTH);
        const z0 = Math.floor(z - HALF_WIDTH);
        const z1 = Math.ceil(z + HALF_WIDTH);
        let sum = F32(0);
        let count = 0;

              const action = steeringAction(yaw,omega,solver.targetYaw,solver.referenceOmega,solver.friction,solver.narrowRoom);
              omega = Math.fround(Math.fround(omega)*solver.friction);
              if (action.turn) omega = Math.fround(omega+action.turn);
              yaw = Math.fround(Math.fround(yaw)+omega);
            }
            releasedOmega = Math.fround(Math.fround(releasedOmega)*solver.friction);
            releasedYaw = Math.fround(Math.fround(releasedYaw)+releasedOmega);
          }
          const key = 'rotation.tick.'+tick;
          const visible = smoothInformation(key+'.opacity',tick < count ? 1 : 0,false,0);
          const next = point(smoothInformation(key+'.yaw',yaw,true),112);
          const released = point(smoothInformation(key+'.releasedYaw',releasedYaw,true),126);
          ctx.globalAlpha = opacity*visible*(.25+.75*(tick+1)/Math.max(count,tick+1));
          informationLine(previous,next,'#9cdcfe',false,1.5); informationDot(next,'#9cdcfe',2);
          informationLine(releasedPrevious,released,'#858585',true,1);
          previous = next; releasedPrevious = released;
        }
        ctx.globalAlpha = opacity;
        const end = point(smoothInformation('rotation.end',yaw,true),112);
        const releasedEnd = point(smoothInformation('rotation.releasedEnd',releasedYaw,true),126);
        ctx.setLineDash([4,4]); drawArrow(center,end,'#9cdcfe',1.5); ctx.setLineDash([]);
        informationDot(releasedEnd,'#858585',3);
      }
      function drawCursor() {
        if (mode === 'drive') return;
        if (!pointer || drag?.kind === 'pan') return;
        if (tool !== 'paint' && tool !== 'erase') return;
        const p = screenFromWorld(pointer.x,pointer.z);
        const width = brushWidth();
        ctx.strokeStyle = tool === 'erase' ? '#f48771' : '#b8d9ea';
        ctx.lineWidth = 1; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.arc(p.x,p.y,width*camera.scale/2,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
      }
      function updateMetrics(visualBoat, projection) {
        const speed = Math.hypot(boat.vx,boat.vz);
        const heading = Math.atan2(-boat.vx,boat.vz) * 180 / Math.PI;
        const slip = speed < 1e-8 ? 0 : ((heading - boat.yaw + 540) % 360 + 360) % 360 - 180;
        $('m-tick').textContent = (boat.tick + subtickPhase / SUBTICKS_PER_TICK).toFixed(1);
        $('m-pos').textContent = `${boat.x.toFixed(2)} / ${boat.z.toFixed(2)}`;
        $('m-speed').textContent = speed.toFixed(3);
        $('m-slip').textContent = `${slip.toFixed(1)}°`;
        $('m-yaw').textContent = `${(((boat.yaw % 360)+360)%360).toFixed(1)}°`;
        $('m-omega').textContent = `${boat.omega.toFixed(2)}°/t`;
        $('m-friction').textContent = physics.frictionAt(boat.x,boat.z,terrainAt).toFixed(3);
        $('m-input').textContent = ['w','a','s','d'].filter(k => lastKeys[k]).map(k => k.toUpperCase()).join('+') || '—';
        const p = projection;
        $('m-route-progress').textContent = p ? `${p.s.toFixed(1)} / ${routeLength.toFixed(1)}` : '—';
        $('m-route-error').textContent = p ? p.distance.toFixed(2) : '—';
        $('m-route-demand').textContent = inputMode === 'auto' ? autoLastDemand.toFixed(2) : '—';
        $('m-route-heading').textContent = inputMode === 'auto' ? `${(((autoDebug.targetYaw % 360)+360)%360).toFixed(1)}°` : '—';
      }
      function interpolatedBoat() {
        if (!playing) return boat;
        const previewKeys = inputMode === 'auto' ? autoKeys : inputMode === 'sequence'
          ? (sequence[sequenceIndex] ?? lastKeys)
          : manualKeys();
        const predicted = physics.step(boat, previewKeys, terrainAt);
        const t = clamp((subtickPhase + accumulator) / SUBTICKS_PER_TICK,0,1);
        const mix = (a,b) => a + (b-a)*t;
        return { x: mix(boat.x,predicted.x), z: mix(boat.z,predicted.z), vx: mix(boat.vx,predicted.vx), vz: mix(boat.vz,predicted.vz), yaw: mix(boat.yaw,predicted.yaw) };
      }
      function updateCamera(visualBoat, dt) {
        if (mode !== 'drive' && !(follow && playing)) return false;
        const heading = visualBoat.yaw * Math.PI/180;
        const ahead = mode === 'drive' ? 3 : 0;
        const targetX = visualBoat.x - Math.sin(heading)*ahead;
        const targetZ = visualBoat.z + Math.cos(heading)*ahead;
        const alpha = 1 - Math.exp(-dt*8);
        camera.x += (targetX-camera.x)*alpha;
        camera.z += (targetZ-camera.z)*alpha;
        camera.rotation = mode === 'drive' ? Math.PI-heading : 0;
        return Math.hypot(targetX-camera.x,targetZ-camera.z) > .001;
      }
      function draw(visualBoat) {
        const projection = routeProjection(visualBoat.x, visualBoat.z, autoProgress);
        const target = inputMode === 'auto' ? routeAt(autoVisualTargetProgress) : routeLookahead(projection, visualBoat);
        ctx.clearRect(0,0,innerWidth,innerHeight);
        ctx.fillStyle = '#1e1e1e'; ctx.fillRect(0,0,innerWidth,innerHeight);
        drawGrid(); drawTrace(visualBoat); drawCurves();
        drawRoutes(target);
        drawInformation(visualBoat,projection,target);
        drawBoat(visualBoat); drawCursor(); updateMetrics(visualBoat, projection);
      }
      function invalidate() { if (!frameId) frameId = requestAnimationFrame(frame); }
      function frame(time) {
        frameId = 0;
        const informationGap = informationAnimationTime ? (time-informationAnimationTime)/1000 : 0;
        informationAnimationDt = informationGap <= .1 ? Math.max(0,informationGap) : 0;
        informationAnimationTime = time;
        informationMoving = false;
        informationAnimationUpdated.clear();
        const dt = lastVisualFrame ? Math.min((time-lastVisualFrame)/1000,.1) : 0;
        lastVisualFrame = time;
        if (playing) {
          if (lastFrame) {
            const elapsedMs = Math.max(0,Math.min(time-lastFrame,200));
            const frameStart = time-elapsedMs;
            const rate = Number($('rate').value);
            const carry = accumulator;
            accumulator += elapsedMs * rate / 10;
            let steps = 0;
            while (playing && accumulator >= 1 && steps < 200) {
              const boundaryTime = frameStart + (steps + 1 - carry) * 10 / rate;
              accumulator--;
              advanceSubtick(boundaryTime);
              steps++;
            }
          }
          lastFrame = time;
        }
        const visualBoat = interpolatedBoat();
        const cameraMoving = updateCamera(visualBoat,dt);
        if (inputMode === 'auto') {
          const remaining = autoTargetProgress-autoVisualTargetProgress;
          autoVisualTargetProgress += Math.max(0,remaining)*(1-Math.exp(-dt*16));
          if (autoTargetProgress-autoVisualTargetProgress < .005) autoVisualTargetProgress = autoTargetProgress;
        } else autoVisualTargetProgress = autoTargetProgress;
        draw(visualBoat);
        let timelineMoving = false;
        if (!$('sequence-panel').hidden) {
          const difference = timelineTargetPixelsPerTick - timelinePixelsPerTick;
          if (Math.abs(difference) > .01) {
            timelinePixelsPerTick += difference * (1 - Math.exp(-dt * 15));
            timelineMoving = true;
          } else timelinePixelsPerTick = timelineTargetPixelsPerTick;
          if (timelineFollowing && inputMode === 'sequence') {
            timelineCenterUnits = clamp(sequenceElapsedUnits + (playing ? accumulator : 0), 0, timelineTotalUnits);
          }
          drawTimeline();
        }
        if (playing || cameraMoving || timelineMoving || informationMoving || autoTargetProgress-autoVisualTargetProgress > .005) invalidate();
      }
      function onKey(event, down) {
        if (event.code === 'F1') {
          event.preventDefault();
          if (down && !event.repeat) toggleUiVisibility();
          return;
        }
        const editing = ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);
        if (editing && down) return;
        const code = event.code;
        const key = ({ KeyW:'w', KeyA:'a', KeyS:'s', KeyD:'d' })[code];
        if (key) {
          event.preventDefault();
          const changed = downKeys.has(key) !== down;
          if (down) downKeys.add(key); else downKeys.delete(key);
          if (changed && playing && inputMode === 'manual') keyEvents.push({ time: performance.now(), key, down });
          updateDriveKeys();
          if (inputMode === 'manual') { lastKeys = manualKeys(); invalidate(); }
          return;
        }
        if (!down) return;
        if (code === 'Space') { event.preventDefault(); if (inputMode !== 'auto') inputMode = 'manual'; setPlaying(!playing); }
        else if (mode === 'drive' && code === 'KeyR') { event.preventDefault(); recording ? (recording = false, renderSequence(), updateButtons()) : beginRecording(); }
        else if (code === 'Escape') { if (mode === 'drive') setMode('edit'); else { penCurve = null; penRoute = tool === 'route' ? resumeRoutePen() : null; selectedCurveId = null; selectedRouteId = null; updateButtons(); invalidate(); } }
        else if (mode === 'edit' && (event.ctrlKey || event.metaKey) && code === 'KeyZ') { event.preventDefault(); event.shiftKey ? redo() : undo(); }
        else if (mode === 'edit' && (event.ctrlKey || event.metaKey) && code === 'KeyY') { event.preventDefault(); redo(); }
        else if (mode === 'edit' && code === 'Delete' && selectedCurveId !== null) {
          saveHistory(); curves = curves.filter(c => c.id !== selectedCurveId); selectedCurveId = null; rebuildCurves();
        }
        else if (mode === 'edit' && code === 'Delete' && selectedRouteId !== null) {
          saveHistory(); removeRoute(selectedRouteId);
        }
      }

      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('pointercancel', onPointerUp);
      canvas.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });
      canvas.addEventListener('contextmenu', e => e.preventDefault());
      canvas.addEventListener('wheel', event => {
        event.preventDefault();
        const anchor = worldFromScreen(event.clientX,event.clientY);
        const nextScale = camera.scale * Math.exp(-event.deltaY*.001);
        if (!Number.isFinite(nextScale) || nextScale <= 0) return;
        camera.scale = nextScale;
        const dx = (event.clientX-innerWidth/2)/camera.scale;
        const dy = (event.clientY-innerHeight/2)/camera.scale;
        const c = Math.cos(camera.rotation), s = Math.sin(camera.rotation);
        camera.x = anchor.x - dx*c - dy*s;
        camera.z = anchor.z + dx*s - dy*c;
        invalidate();
      }, { passive: false });
      const sequenceTimeline = $('sequence-timeline');
      sequenceTimeline.addEventListener('wheel', event => {
        event.preventDefault();
        const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? sequenceTimeline.clientHeight : 1);
        timelineTargetPixelsPerTick = clamp(timelineTargetPixelsPerTick * Math.exp(-delta * .0012), 2, 160);
        invalidate();
      }, { passive: false });
      sequenceTimeline.addEventListener('pointerdown', event => {
        if (event.button !== 0 && event.button !== 1) return;
        timelineDrag = { id: event.pointerId, startY: event.clientY, center: timelineCenterUnits, moved: false };
        sequenceTimeline.setPointerCapture(event.pointerId);
        event.preventDefault();
      });
      sequenceTimeline.addEventListener('pointermove', event => {
        if (!timelineDrag || event.pointerId !== timelineDrag.id) return;
        const distance = event.clientY - timelineDrag.startY;
        if (!timelineDrag.moved && Math.abs(distance) > 3) {
          timelineDrag.moved = true;
          if (inputMode === 'sequence' && playing) setPlaying(false);
          timelineFollowing = false;
          sequenceTimeline.classList.add('dragging');
        }
        if (timelineDrag.moved) {
          timelineCenterUnits = clamp(timelineDrag.center - distance * SUBTICKS_PER_TICK / timelinePixelsPerTick, 0, timelineTotalUnits);
          drawTimeline();
          invalidate();
        }
      });
      const finishTimelineDrag = event => {
        if (!timelineDrag || event.pointerId !== timelineDrag.id) return;
        if (!timelineDrag.moved && event.type === 'pointerup') {
          const box = sequenceTimeline.getBoundingClientRect();
          const units = timelineCenterUnits + (event.clientY - box.top - box.height / 2) * SUBTICKS_PER_TICK / timelinePixelsPerTick;
          selectedSequenceIndex = rowIndexAt(clamp(units, 0, timelineTotalUnits));
          renderSequenceEditor();
          drawTimeline();
        }
        sequenceTimeline.classList.remove('dragging');
        if (sequenceTimeline.hasPointerCapture(event.pointerId)) sequenceTimeline.releasePointerCapture(event.pointerId);
        timelineDrag = null;
      };
      sequenceTimeline.addEventListener('pointerup', finishTimelineDrag);
      sequenceTimeline.addEventListener('pointercancel', finishTimelineDrag);
      sequenceTimeline.addEventListener('auxclick', event => { if (event.button === 1) event.preventDefault(); });
      window.addEventListener('keydown', e => onKey(e,true));
      window.addEventListener('keyup', e => onKey(e,false));
      window.addEventListener('blur', () => {
        if (playing && inputMode === 'manual') for (const key of downKeys) keyEvents.push({ time: performance.now(), key, down: false });
        downKeys.clear(); updateDriveKeys(); if (inputMode === 'manual') lastKeys = EMPTY_KEYS; invalidate();
      });
      window.addEventListener('resize', () => {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(innerWidth*dpr); canvas.height = Math.round(innerHeight*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
        positionInformationPanel();
        invalidate();
      });
      $('information-toggle').addEventListener('click', () => {
        information.enabled = !information.enabled;
        solverVisualization = null;
        updateInformationControls();
      });
      for (const input of document.querySelectorAll('[data-information]')) input.addEventListener('change', () => {
        information.layers[input.dataset.information] = input.checked;
        solverVisualization = null;
        invalidate();
      });
      for (const button of document.querySelectorAll('[data-tool]')) button.addEventListener('click', () => setTool(button.dataset.tool));
      $('mode-toggle').addEventListener('click', () => setMode(mode === 'drive' ? 'edit' : 'drive'));
      $('record-toggle').addEventListener('click', () => { if (recording) { recording = false; renderSequence(); updateButtons(); } else beginRecording(); });
      $('undo').addEventListener('click', undo);
      $('redo').addEventListener('click', redo);
      $('clear').addEventListener('click', () => { saveHistory(); tiles.clear(); curves = []; selectedCurveId = null; penCurve = null; rebuildCurves(); });
      $('play').addEventListener('click', () => { if (inputMode !== 'auto') inputMode = 'manual'; setPlaying(!playing); });
      $('step').addEventListener('click', () => { setPlaying(false); advanceSubtick(performance.now()); });
      $('reset').addEventListener('click', () => { setPlaying(false); recording = false; inputMode = 'manual'; livePath = null; resetBoat(); renderSequence(); if (mode === 'drive') { beginRecording(); setPlaying(true); } });
      $('auto-run').addEventListener('click', runAuto);
      $('route-calculate').addEventListener('click', () => {
        if (livePath) {
          livePath = null;
          recording = false;
          if (playing) setPlaying(false);
          else updateButtons();
          showToast('已停止自动路径');
          return;
        }
        try { startLivePath(); }
        catch (error) { showToast(error.message || '路径生成失败'); }
      });
      $('route-clear').addEventListener('click', () => { if (!routes.length) return; saveHistory(); routes = []; selectedRouteId = null; penRoute = null; autoProgress = 0; rebuildRoute(); });
      $('follow').addEventListener('click', () => { follow = !follow; updateButtons(); });
      $('center').addEventListener('click', () => { const yaw = boat.yaw*Math.PI/180; camera.x = boat.x - (mode === 'drive' ? Math.sin(yaw)*3 : 0); camera.z = boat.z + (mode === 'drive' ? Math.cos(yaw)*3 : 0); invalidate(); });
      $('rate').addEventListener('change', () => { if (mode === 'drive') $('rate').blur(); });
      $('width').addEventListener('change', () => { $('width').value = String(brushWidth()); invalidate(); });
      $('sequence-toggle').addEventListener('click', () => {
        $('sequence-panel').hidden = !$('sequence-panel').hidden;
        $('sequence-toggle').setAttribute('aria-expanded', String(!$('sequence-panel').hidden));
        updateSequenceHighlight();
        invalidate();
      });
      $('sequence-close').addEventListener('click', () => { $('sequence-panel').hidden = true; $('sequence-toggle').setAttribute('aria-expanded','false'); });
      $('sequence-add').addEventListener('click', () => {
        if (sequence.length >= MAX_SEQUENCE_ROWS) return;
        const end = timelineTotalUnits;
        editSequence(() => sequence.push({ units: 200, w: false, a: false, s: false, d: false }), end);
        timelineCenterUnits = end;
        drawTimeline();
      });
      $('sequence-duration').addEventListener('change', event => {
        const index = selectedSequenceIndex;
        if (index < 0) return;
        const units = clamp(Math.round(Number(event.target.value) * SUBTICKS_PER_TICK) || sequence[index].units, 1, MAX_ROW_UNITS);
        if (units === sequence[index].units) { renderSequenceEditor(); return; }
        editSequence(() => { sequence[index].units = units; }, timelineRows[index].start);
      });
      for (const button of document.querySelectorAll('[data-sequence-key]')) button.addEventListener('click', () => {
        const index = selectedSequenceIndex;
        if (index < 0) return;
        const key = button.dataset.sequenceKey;
        editSequence(() => { sequence[index][key] = !sequence[index][key]; }, timelineRows[index].start);
      });
      $('sequence-remove').addEventListener('click', () => {
        const index = selectedSequenceIndex;
        if (index < 0) return;
        editSequence(() => { sequence.splice(index, 1); }, timelineRows[index].start);
      });
      $('sequence-run').addEventListener('click', runSequence);
      $('export').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(serialize(), null, 2)], { type:'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a'); link.href = url; link.download = 'ice-field.json'; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('JSON 已导出');
      });
      $('import').addEventListener('click', () => $('file').click());
      $('file').addEventListener('change', async event => {
        const file = event.target.files?.[0];
        if (!file) return;
        try { loadData(JSON.parse(await file.text())); showToast('JSON 已导入'); }
        catch (error) { showToast(error.message || '导入失败'); }
        event.target.value = '';
      });
      globalThis.iceBoatLab = Object.freeze({
        getState: () => copy(boat),
        getInformation: () => {
          if (information.enabled) currentSolverVisualization();
          return { ...copy(information), solver: information.enabled && inputMode === 'auto' ? copy(solverVisualization) : null };
        },
        getView: () => { const projection = routeProjection(boat.x,boat.z,autoProgress); const p = inputMode === 'auto' ? routeAt(autoTargetProgress) : routeLookahead(projection,boat); return { mode, playing, recording, inputMode, clock: boat.tick + subtickPhase / SUBTICKS_PER_TICK, subtickPhase, camera: copy(camera), displayBoat: copy(interpolatedBoat()), route: { length: routeLength, progress: autoProgress, targetProgress: autoTargetProgress, projection: copy(projection), p: copy(p), displayP: copy(inputMode === 'auto' ? routeAt(autoVisualTargetProgress) : p), maxError: autoMaxError, demand: autoLastDemand, ticks: autoTicks, debug: copy(autoDebug) } }; },
         autoTick: () => { if (inputMode !== 'auto' || !playing) return copy(boat); for (let unit = 0; unit < SUBTICKS_PER_TICK && playing; unit++) advanceSubtick(performance.now()); return copy(boat); },
        step: keys => { previousBoat = { ...boat }; boat = physics.step(boat, { ...EMPTY_KEYS, ...keys }, terrainAt); subtickPhase = 0; accumulator = 0; trace.push({ x:boat.x, z:boat.z }); lastKeys = { ...EMPTY_KEYS, ...keys }; autoProgress = routeProjection(boat.x,boat.z,autoProgress)?.s ?? 0; invalidate(); return copy(boat); },
        sampleRoute: distance => copy(routeAt(distance)),
        projectRoute: (x,z) => copy(routeProjection(x,z,autoProgress)),
        hullOnIce,
        demoCenterline,
        terrainAt,
        exportData: serialize,
        importData: loadData
      });
      resetBoat();
      renderSequence();
      updateButtons();
      window.dispatchEvent(new Event('resize'));
    })();
  </script>
</body>
